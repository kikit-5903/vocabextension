<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VocabList Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    body {
      font-family: monospace, sans-serif;
      max-width: 950px;
      margin: 40px auto;
      padding: 0 24px;
      background: #f7f4ed;
      color: #1a1a1a;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 3px solid #1a1a1a;
      padding-bottom: 12px;
    }
    h1 {
      margin: 0;
      color: #1a1a1a;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.05em;
    }
    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .controls-bar select, .controls-bar input {
      background: #ffffff;
      border: 2px solid #1a1a1a;
      box-shadow: 2px 2px 0px #1a1a1a;
      padding: 8px 12px;
      font-family: monospace, sans-serif;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      outline: none;
    }
    .controls-bar input {
      flex: 1;
      min-width: 200px;
    }
    .category-section {
      background: #ffffff;
      border: 3px solid #1a1a1a;
      box-shadow: 4px 4px 0px #1a1a1a;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .category-header {
      font-size: 18px;
      font-weight: 800;
      color: #1a1a1a;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
    }
    .category-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .export-btn {
      background: #ff5a36;
      color: white;
      border: 2px solid #1a1a1a;
      box-shadow: 2px 2px 0px #1a1a1a;
      border-radius: 4px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      font-family: monospace;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .export-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #1a1a1a;
    }
    .vocab-table {
      width: 100%;
      border-collapse: collapse;
    }
    .vocab-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 800;
      color: #555;
      padding-bottom: 10px;
      border-bottom: 2px solid #1a1a1a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .vocab-table td {
      padding: 14px 8px;
      border-bottom: 1px solid #e1ded6;
      vertical-align: top;
      font-size: 13px;
    }
    .vocab-table tr:last-child td {
      border-bottom: none;
    }
    .vocab-col {
      width: 35%;
      font-weight: 800;
      color: #1a1a1a;
      text-transform: capitalize;
    }
    .def-col {
      width: 55%;
      color: #444;
      line-height: 1.4;
    }
    .action-col {
      width: 10%;
      text-align: right;
    }
    .delete-btn {
      background: #ff4d4f;
      color: white;
      border: 2px solid #1a1a1a;
      box-shadow: 2px 2px 0px #1a1a1a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .delete-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #1a1a1a;
    }
    .empty-state {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 50px;
      background: #ffffff;
      border: 3px solid #1a1a1a;
      box-shadow: 4px 4px 0px #1a1a1a;
      border-radius: 8px;
    }
    @media print {
      body { background: white; margin: 0; padding: 10px; }
      .controls-bar, .action-col, .export-btn, header { display: none !important; }
      .category-section { border: none; box-shadow: none; padding: 0; margin-bottom: 20px; }
      .category-section.hidden-for-print { display: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>VOCABLIST DASHBOARD</h1>
    <span id="totalCount" style="font-weight: 700; font-size: 13px;"></span>
  </header>

  <div class="controls-bar">
    <select id="categoryFilter">
      <option value="ALL">All Categories</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search terms or definitions...">
  </div>

  <div id="dashboardContent"></div>
  <script src="dashboard.js"></script>
</body>
</html>
