<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: monospace, sans-serif;
      padding: 14px;
      margin: 0;
      background: #f7f4ed;
      color: #1a1a1a;
      box-sizing: border-box;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.05em;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 6px;
    }
    .panel {
      background: #ffffff;
      border: 2px solid #1a1a1a;
      box-shadow: 3px 3px 0px #1a1a1a;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select, input[type="text"] {
      background: #f7f4ed;
      border: 2px solid #1a1a1a;
      color: #1a1a1a;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      width: 130px;
      outline: none;
    }
    
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border: 2px solid #1a1a1a; transition: .2s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: #1a1a1a; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: #ff5a36; }
    input:checked + .slider:before { transform: translateX(16px); background-color: #ffffff; }

    /* Dashboard Button */
    .dashboard-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #ff5a36;
      color: white;
      border: 2px solid #1a1a1a;
      box-shadow: 3px 3px 0px #1a1a1a;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      margin-bottom: 12px;
      text-decoration: none;
      box-sizing: border-box;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .dashboard-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #1a1a1a;
    }
    .dashboard-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1a1a1a;
    }

    /* List container */
    .vocab-container {
      max-height: 180px;
      overflow-y: auto;
    }
    .vocab-item {
      background: #ffffff;
      border: 2px solid #1a1a1a;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      box-shadow: 2px 2px 0px #1a1a1a;
    }
    .vocab-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .vocab-word {
      font-weight: 800;
      font-size: 12px;
      text-transform: capitalize;
    }
    .vocab-def {
      font-size: 11px;
      color: #555;
      line-height: 1.3;
    }
    .delete-btn {
      background: #ff4d4f;
      color: white;
      border: 1px solid #1a1a1a;
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      line-height: 1;
    }
    .delete-btn:hover {
      background: #d9363e;
    }
    .empty-text {
      text-align: center;
      color: #777;
      font-size: 11px;
      font-style: italic;
      padding: 12px;
      background: #ffffff;
      border: 2px solid #1a1a1a;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h3>VOCABLIST</h3>
  
  <div class="panel">
    <div class="row">
      <label>Tracking</label>
      <label class="switch">
        <input type="checkbox" id="toggleTracking" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row" style="margin-top: 8px;">
      <label>Category</label>
      <div style="display: flex; gap: 4px; align-items: center;">
        <select id="categorySelect"></select>
        <button id="deleteCategoryBtn" title="Delete Category" style="background: #ff4d4f; color: white; border: 2px solid #1a1a1a; border-radius: 4px; padding: 3px 6px; cursor: pointer; font-size: 10px; display: none;">✕</button>
      </div>
    </div>
    <div class="row" id="newCategoryRow" style="display: none; margin-top: 8px;">
      <input type="text" id="newCategoryInput" placeholder="Name...">
      <button id="addCategoryBtn" style="padding: 4px 8px; background: #1a1a1a; color: white; border: 2px solid #1a1a1a; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 11px;">Add</button>
    </div>
  </div>

  <button id="openDashboard" class="dashboard-btn">Open Full Dashboard &rarr;</button>

  <div class="vocab-container" id="wordListContainer"></div>

  <script src="popup.js"></script>
</body>
</html>
