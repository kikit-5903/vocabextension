<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VocabList Popup</title>
  <style>
    body {
      font-family: monospace, sans-serif;
      width: 320px;
      max-height: 500px;
      overflow-y: auto;
      padding: 14px;
      background: #f7f4ed;
      color: #1a1a1a;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      font-weight: 900;
      letter-spacing: -0.03em;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 6px;
    }
    .control-box, .word-card {
      background: #fff;
      border: 2px solid #1a1a1a;
      box-shadow: 3px 3px 0px #1a1a1a;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .control-row:last-child {
      margin-bottom: 0;
    }
    .control-label {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; border: 2px solid #1a1a1a; transition: .3s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px;
      background-color: white; border: 2px solid #1a1a1a; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #ff5722; }
    input:checked + .slider:before { transform: translateX(22px); }

    select {
      font-family: monospace;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 6px;
      border: 2px solid #1a1a1a;
      background: #fff;
      border-radius: 4px;
      outline: none;
      width: 140px;
    }
    .btn-icon {
      background: #ff5252;
      color: #fff;
      border: 2px solid #1a1a1a;
      width: 22px;
      height: 22px;
      font-weight: 900;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .dashboard-btn {
      width: 100%;
      background: #ff5722;
      color: #fff;
      border: 2px solid #1a1a1a;
      box-shadow: 3px 3px 0px #1a1a1a;
      padding: 10px;
      font-family: monospace;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .dashboard-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1a1a1a;
    }
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .word-title {
      font-size: 13px;
      font-weight: 900;
    }
    .word-cat {
      font-size: 10px;
      color: #666;
      font-weight: 700;
    }
    .word-def {
      font-size: 11px;
      color: #333;
      line-height: 1.3;
      word-break: break-word;
    }
    .empty-state {
      text-align: center;
      font-size: 11px;
      color: #666;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h2>VOCABLIST</h2>

  <!-- Controls Box -->
  <div class="control-box">
    <div class="control-row">
      <span class="control-label">Tracking</span>
      <label class="switch">
        <input type="checkbox" id="trackingToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="control-row" style="margin-top: 10px;">
      <span class="control-label">Category</span>
      <div style="display: flex; gap: 6px; align-items: center;">
        <select id="categorySelect"></select>
        <button class="btn-icon" id="deleteCategoryBtn" title="Delete category">×</button>
      </div>
    </div>
  </div>

  <!-- Open Full Dashboard Button -->
  <button class="dashboard-btn" id="openDashboard">Open Full Dashboard →</button>

  <!-- Saved Words List -->
  <div id="wordsListContainer"></div>

  <script src="popup.js"></script>
</body>
</html>
